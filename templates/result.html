<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Analysis Results</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
        }
        .card {
            border-radius: 15px;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
            border-radius: 20px;
        }
        .img-responsive {
            max-width: 100%;
            height: auto;
        }
        .img-gallery {
            margin-top: 20px;
        }
        .img-item {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow">
            <div class="card-body text-center">
                <h2 class="card-title mb-4">Image Analysis Results</h2>
                
                {% if images|length == 1 %}
                    <!-- Single image case -->
                    <p><strong>Light Region:</strong> {{ light }}%</p>
                    <p><strong>Dark Region:</strong> {{ dark }}%</p>
                {% else %}
                    <!-- Multiple images case -->
                    <p><strong>Average Light Region:</strong> {{ light }}%</p>
                    <p><strong>Average Dark Region:</strong> {{ dark }}%</p>
                {% endif %}

                <h4 class="mt-4">Uploaded Images:</h4>
                <div class="img-gallery">
                    {% for img in images %}
                        <div class="img-item">
                            <img src="data:image/png;base64,{{ img }}" alt="Uploaded Image" class="img-responsive">
                        </div>
                    {% endfor %}
                </div>
                <br>
                <a href="/" class="btn btn-custom">Upload More Images</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
